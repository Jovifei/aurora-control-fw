name: temporary fast fault rearm guard fix

on:
  push:
    branches:
      - codex/fix-fast-fault-rearm-guard

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-fast-fault-rearm-guard
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Complete Host mock function contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/_fix_fast_fault_rearm_guard.py')
          text = path.read_text(encoding='utf-8')
          old = '    "bool drv_comp_fast_fault_source_active(void)\\n{\\n    return g_break_source || g_comp2_source;\\n}\\n",\n'
          new = (
              '    "/*---------------------------------------------------------------------------*\\n"\n'
              '    " * Name        : bool drv_comp_fast_fault_source_active(void)\\n"\n'
              '    " * Input       : 无\\n"\n'
              '    " * Output      : true表示COMP0或COMP2任一路Host快速故障源仍有效\\n"\n'
              '    " * Description : 与目标Driver保持同一语义；COMP2持续故障同样阻止PWM重启和恢复。\\n"\n'
              '    " *---------------------------------------------------------------------------*/\\n"\n'
              '    "bool drv_comp_fast_fault_source_active(void)\\n{\\n    return g_break_source || g_comp2_source;\\n}\\n",\n'
          )
          if old not in text:
              raise SystemExit('mock function literal not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Patch, verify, clean and commit
        run: python tools/_fix_fast_fault_rearm_guard.py
