name: final resource closeout

on:
  push:
    branches:
      - codex/o1-stack-lock-work

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ !contains(github.event.head_commit.message, '[resource-closeout]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/o1-stack-lock-work
          fetch-depth: 0

      - name: 完整质量门与目标资源验证
        shell: bash
        run: |
          git diff --check
          python tools/run_checks.py

      - name: 清理一次性工作流并固定候选树
        shell: bash
        run: |
          rm -f .github/workflows/final-resource-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Jovifei@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "验证：目标栈与8KB SRAM资源门禁通过 [resource-closeout]"
          git push origin HEAD:codex/o1-stack-lock-work
