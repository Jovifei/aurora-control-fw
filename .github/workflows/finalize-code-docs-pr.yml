name: Finalize code-analysis PR contents

on:
  push:
    branches:
      - codex/v0.10.1-function-docs-comments

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Remove temporary review-note files and finalize report
        run: |
          rm -f docs/程序代码分析/merge-readiness-note.md
          rm -f docs/程序代码分析/{21-合并后维护说明.md,22-审阅结论.md,23-变更范围声明.md,24-质量门执行命令.md,25-审阅清单.md,26-索引补充.md,27-最终审阅状态.md,28-合并边界.md,29-审阅人说明.md,30-自动化审计说明.md,31-合并后验证.md,32-最终入口.md,33-说明.md,34-请勿以此文件替代报告.md}
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/程序代码分析/20-300W函数级代码分析与注释交付报告.md')
          text = path.read_text(encoding='utf-8', errors='strict')
          text = text.replace('__PR_NUMBER__', '#8')
          text = text.replace('__PR_CI_STATUS__', '等待本次最终提交的远端 CI')
          text = text.replace('__MERGE_SHA__', '待合并')
          text = text.replace('__MAIN_CI_STATUS__', '待合并后复验')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/finalize-code-docs-pr.yml
      - name: Re-run all checks
        run: |
          python tools/check_text_encoding.py
          python tools/check_comment_style.py
          python tools/run_checks.py
          git diff --check
      - name: Commit finalized PR contents
        run: |
          git add -A
          git commit -m "docs(code): finalize audited report and remove temporary review notes"
          git push origin HEAD:codex/v0.10.1-function-docs-comments
