static void test_demo_high_bus_and_stale_generation_are_rejected(void)
{
    aurora_runtime_t runtime;
    aurora_power_stage_ctx_t ctx;
    aurora_measurement_t sample = valid_sample(10U, 10U);
    aurora_mppt_output_t mppt = {0};
