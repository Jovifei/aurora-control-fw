/*---------------------------------------------------------------------------*
 * Name        : static void test_demo_high_bus_and_stale_generation_are_rejected(void)
 * Input       : 无
 * Output      : 无
 * Description : Demo闭合只允许低残压BUS；Relay反馈代次不匹配时不得推进机械稳定状态。
