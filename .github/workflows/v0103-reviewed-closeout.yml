name: v0.10.3 reviewed closeout

on:
  push:
    branches:
      - codex/v0.10.3-safety-handshake-closeout

permissions:
  contents: write

jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[v0103-reviewed-closeout]') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.10.3-safety-handshake-closeout
          fetch-depth: 0
      - name: Apply reviewed source fixes
        run: |
          python tools/_v0103_reviewed_closeout.py
          python tools/_v0103_fix_test_comments.py
      - name: Validate all firmware gates
        run: |
          git diff --check
          python tools/run_checks.py
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close reviewed v0.10.3 safety gaps [v0103-reviewed-closeout]"
          git push origin HEAD:codex/v0.10.3-safety-handshake-closeout
