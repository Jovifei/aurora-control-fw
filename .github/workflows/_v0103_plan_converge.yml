name: v0.10.3 plan converge temporary

on:
  push:
    branches:
      - codex/v0.10.3-safety-handshake-closeout

permissions:
  contents: write

jobs:
  converge:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.10.3-safety-handshake-closeout
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize temporary convergence helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/_v0103_plan_converge.py')
          text = path.read_text(encoding='utf-8')
          old = 'p = replace_once(p, "            ctx->precharge_low_power_since_ms = 0U;\\n", "", "precharge low timer init")'
          new = 'p = p.replace("            ctx->precharge_low_power_since_ms = 0U;\\n", "")'
          if old not in text:
              raise SystemExit('temporary helper normalization pattern missing')
          text = text.replace(old, new, 1)
          anchor = 'if "relay_generation" in p or "AURORA_PRECHARGE_WEAK_" in p:\n    raise SystemExit("test_v0103.c: generation/heuristic residue remains")'
          insert = ('p = p.replace("    runtime.app.power_command.relay_generation = 1U;\\n", "")\n'
                    'p = p.replace("    CHECK(runtime.relay_applied_generation == 1U);\\n", "")\n'
                    + anchor)
          if anchor not in text:
              raise SystemExit('test generation cleanup anchor missing')
          path.write_text(text.replace(anchor, insert, 1), encoding='utf-8', newline='\n')
          PY
      - name: Apply approved v0.10.3 scope convergence and verify
        run: python tools/_v0103_plan_converge.py
