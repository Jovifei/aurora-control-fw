name: Apply function docs and comments patch

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v0.10.1-function-docs-comments
    paths:
      - .github/workflows/apply-function-docs-comments.yml

permissions:
  contents: write

concurrency:
  group: apply-function-docs-comments
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v0.10.1-function-docs-comments

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          for index in 00 01 02 03 04 05 06 07 08; do
            test -f ".github/patches/function-docs-comments.part${index}"
          done
          cat \
            .github/patches/function-docs-comments.part00 \
            .github/patches/function-docs-comments.part01 \
            .github/patches/function-docs-comments.part02 \
            .github/patches/function-docs-comments.part03 \
            .github/patches/function-docs-comments.part04 \
            .github/patches/function-docs-comments.part05 \
            .github/patches/function-docs-comments.part06 \
            .github/patches/function-docs-comments.part07 \
            .github/patches/function-docs-comments.part08 \
            > /tmp/function-docs-comments.patch.gz.b64
          test "$(wc -c < /tmp/function-docs-comments.patch.gz.b64)" -eq 173184
          base64 --decode /tmp/function-docs-comments.patch.gz.b64 \
            > /tmp/function-docs-comments.patch.gz
          gzip --test /tmp/function-docs-comments.patch.gz
          gzip --decompress --stdout /tmp/function-docs-comments.patch.gz \
            > /tmp/function-docs-comments.patch
          test "$(wc -c < /tmp/function-docs-comments.patch)" -eq 610858
          git apply --check /tmp/function-docs-comments.patch

      - name: Apply reviewed source and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/function-docs-comments.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-function-docs-comments.yml
          git diff --check

      - name: Run complete firmware quality gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_checks.py

      - name: Commit and push final branch tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(code): add function-level analysis and standardize comments" \
            -m "Add the complete 300W code-analysis learning set, standardized APP/Driver comments, UTF-8 and comment-style audits, and the delivery report. The application and driver executable token stream remains unchanged."
          git push origin HEAD:codex/v0.10.1-function-docs-comments
