name: flash stop-save closeout temporary v3

on:
  push:
    branches:
      - codex/flash-stop-save-guard

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flash-stop-save-guard
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize recent worklog, helper and remove temporary carrier
        run: |
          mkdir -p 'docs/bringup/过程记录'
          git mv tasks/todo.md 'docs/bringup/过程记录/todo.md'
          git mv tasks/lessons.md 'docs/bringup/过程记录/lessons.md'
          rmdir tasks
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/_flash_stop_save_closeout.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if (!drv_flash_read(target + (uint32_t)offset, verify, sizeof(verify)) ||\n            (memcmp(verify, &page[offset], sizeof(verify)) != 0))\n        {\n            return false;\n        }'''
          new = '''        size_t byte;\n        if (!drv_flash_read(target + (uint32_t)offset, verify, sizeof(verify)))\n        {\n            return false;\n        }\n        for (byte = 0U; byte < sizeof(verify); ++byte)\n        {\n            if (verify[byte] != page[offset + byte])\n            {\n                return false;\n            }\n        }'''
          if old not in text:
              raise SystemExit('memcmp helper pattern missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/_flash_stop_save_closeout_v3.yml
      - name: Patch, verify, clean and commit
        run: python tools/_flash_stop_save_closeout.py
