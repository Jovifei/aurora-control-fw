name: flash journal stack closeout

on:
  push:
    branches:
      - codex/flash-safe-stop-persistence

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ !contains(github.event.head_commit.message, '[flash-stack-closeout]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flash-safe-stop-persistence
          fetch-depth: 0

      - name: 应用1KB目标栈安全修复
        shell: bash
        run: |
          python tools/_flash_stack_closeout.py
          python - <<'PY'
          from pathlib import Path

          doc = Path('docs/48-v0.10.3-Flash安全持久化与最近三次远端提交审核.md')
          doc.write_text(doc.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')

          contract = Path('tests/test_flash_safe_persistence_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = '        self.assertIn("staged.sequence = runtime->app.storage.sequence + 1U;", storage)\n'
          new = '        self.assertIn("next_sequence = runtime->app.storage.sequence + 1U;", storage)\n'
          if text.count(old) != 1:
              raise SystemExit('old staged sequence contract not found exactly once')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          main_path = Path('app/src/main.c')
          main = main_path.read_text(encoding='utf-8')
          marker = '''/* Flash Journal单线程工作页；避免512B页缓冲占用目标仅1KB的启动栈。 */\nstatic uint8_t g_storage_page_workspace[AURORA_STORAGE_PAGE_SIZE];\n'''
          helper = '''/* Flash Journal单线程工作页；避免512B页缓冲占用目标仅1KB的启动栈。 */\nstatic uint8_t g_storage_page_workspace[AURORA_STORAGE_PAGE_SIZE];\n\n/*---------------------------------------------------------------------------*\n * Name        : static bool storage_bytes_equal(const uint8_t *left,\n *               const uint8_t *right, size_t length)\n * Input       : left/right - 待比较字节块；length - 有界长度\n * Output      : true表示逐字节完全一致\n * Description : Flash回读只比较32B小块，避免为裸机目标额外依赖memcmp库符号。\n *---------------------------------------------------------------------------*/\nstatic bool storage_bytes_equal(const uint8_t *left, const uint8_t *right, size_t length)\n{\n    size_t index;\n\n    for (index = 0U; index < length; ++index)\n    {\n        if (left[index] != right[index])\n        {\n            return false;\n        }\n    }\n    return true;\n}\n'''
          if main.count(marker) != 1:
              raise SystemExit('storage workspace insertion point not found exactly once')
          main = main.replace(marker, helper, 1)
          old_cmp = '(memcmp(verify, &page[offset], chunk) != 0)'
          new_cmp = '!storage_bytes_equal(verify, &page[offset], chunk)'
          if main.count(old_cmp) != 1:
              raise SystemExit('memcmp flash verify expression not found exactly once')
          main = main.replace(old_cmp, new_cmp, 1)
          main_path.write_text(main, encoding='utf-8', newline='\n')
          PY

      - name: 完整质量门验证
        shell: bash
        run: |
          git diff --check
          python tools/run_checks.py

      - name: 清理一次性工具并提交
        shell: bash
        run: |
          rm -f tools/_flash_stack_closeout.py
          rm -f .github/workflows/flash-stack-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "修复：消除 Flash Journal 在1KB目标栈上的大对象溢出风险 [flash-stack-closeout]"
          git push origin HEAD:codex/flash-safe-stop-persistence
