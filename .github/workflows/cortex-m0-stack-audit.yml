name: cortex m0 stack audit

on:
  push:
    branches:
      - codex/cortex-m0-stack-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cortex-m0-stack-audit

      - name: 生成Cortex-M0+静态栈占用
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aurora-stack-stub /tmp/aurora-stack-out
          cat > /tmp/aurora-stack-stub/string.h <<'EOF'
          #ifndef AURORA_STACK_STRING_H
          #define AURORA_STACK_STRING_H
          #include <stddef.h>
          void *memset(void *s, int c, size_t n);
          void *memcpy(void *dest, const void *src, size_t n);
          void *memmove(void *dest, const void *src, size_t n);
          #endif
          EOF

          COMMON=(
            --target=arm-none-eabi
            -mcpu=cortex-m0plus
            -mthumb
            -std=c11
            -ffreestanding
            -O2
            -fstack-usage
            -DUSE_FULL_DDL_DRIVER
            -DG32F031xx
            -I/tmp/aurora-stack-stub
            -Iapp/inc
            -Idriver/inc
            -Ivendor/cmsis/Include
            -Ivendor/device/Include
            -Ivendor/ddl/Include
            -Wall
            -Wextra
            -Wpedantic
            -Wconversion
            -Wsign-conversion
            -Wshadow
            -Wstrict-prototypes
            -Wmissing-prototypes
            -Werror
          )

          clang "${COMMON[@]}" -c app/src/main.c -o /tmp/aurora-stack-out/main.o
          clang "${COMMON[@]}" -c app/src/storage.c -o /tmp/aurora-stack-out/storage.o
          clang "${COMMON[@]}" -c app/src/protocol.c -o /tmp/aurora-stack-out/protocol.o

          echo '=== raw .su files ==='
          find /tmp/aurora-stack-out -name '*.su' -maxdepth 1 -print -exec cat {} \;

          echo '=== key functions ==='
          grep -hE '(^|:)(aurora_runtime_poll|process_uart|aurora_app_on_protocol_frame|aurora_app_apply_settings|load_storage|storage_read_page|runtime_storage|storage_write_transaction|storage_bytes_equal|aurora_storage_classify_page|aurora_storage_encode_page_sequence|aurora_protocol_take_frame|aurora_protocol_encode)(\t|$)' /tmp/aurora-stack-out/*.su || true

          echo '=== largest frames ==='
          cat /tmp/aurora-stack-out/*.su | awk -F '\t' '{print $2 "\t" $1 "\t" $3}' | sort -nr | head -40
