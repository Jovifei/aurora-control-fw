name: cortex m0 stack audit

on:
  push:
    branches:
      - codex/cortex-m0-stack-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cortex-m0-stack-audit

      - name: 生成Cortex-M0+全首方静态栈与调用链
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aurora-stack-stub /tmp/aurora-stack-out /tmp/aurora-stack-ir
          cat > /tmp/aurora-stack-stub/string.h <<'EOF'
          #ifndef AURORA_STACK_STRING_H
          #define AURORA_STACK_STRING_H
          #include <stddef.h>
          void *memset(void *s, int c, size_t n);
          void *memcpy(void *dest, const void *src, size_t n);
          void *memmove(void *dest, const void *src, size_t n);
          #endif
          EOF

          COMMON=(
            --target=arm-none-eabi
            -mcpu=cortex-m0plus
            -mthumb
            -std=c11
            -ffreestanding
            -O2
            -DUSE_FULL_DDL_DRIVER
            -DG32F031xx
            -I/tmp/aurora-stack-stub
            -Iapp/inc
            -Idriver/inc
            -Ivendor/cmsis/Include
            -Ivendor/device/Include
            -Ivendor/ddl/Include
            -Wall
            -Wextra
            -Wpedantic
            -Wconversion
            -Wsign-conversion
            -Wshadow
            -Wstrict-prototypes
            -Wmissing-prototypes
            -Werror
          )

          for src in app/src/*.c driver/src/*.c; do
            base="$(basename "${src}" .c)"
            extra=()
            if [[ "${src}" == "app/src/interrupts.c" ]]; then
              extra=(-Wno-missing-prototypes)
            fi
            clang "${COMMON[@]}" "${extra[@]}" -fstack-usage -c "${src}" -o "/tmp/aurora-stack-out/${base}.o"
            clang "${COMMON[@]}" "${extra[@]}" -S -emit-llvm "${src}" -o "/tmp/aurora-stack-ir/${base}.ll"
          done

          echo '=== largest first-party frames ==='
          cat /tmp/aurora-stack-out/*.su | awk -F '\t' '{print $2 "\t" $1 "\t" $3}' | sort -nr | head -80

          echo '=== key frames ==='
          grep -hE '(aurora_runtime_poll|aurora_runtime_init|aurora_app_step_1ms|process_uart|aurora_app_on_protocol_frame|aurora_app_apply_settings|load_storage|runtime_storage|storage_write_transaction|aurora_storage_classify_page|SysTick_Handler|DMA_CH1_IRQHandler|ADC_IRQHandler|ATMR_BRK_UP_TRG_COM_IRQHandler|COMP0_IRQHandler|COMP1_2_3_IRQHandler|USART_IRQHandler)' /tmp/aurora-stack-out/*.su || true

          python - <<'PY'
          from pathlib import Path
          import re

          out = Path('/tmp/aurora-stack-out')
          ir_dir = Path('/tmp/aurora-stack-ir')
          frames = {}
          for su in out.glob('*.su'):
              for raw in su.read_text().splitlines():
                  if not raw.strip():
                      continue
                  loc, size, kind = raw.split('\t')[:3]
                  func = loc.rsplit(':', 1)[-1]
                  frames[func] = max(frames.get(func, 0), int(size))

          calls = {name: set() for name in frames}
          unresolved = {name: set() for name in frames}
          define_re = re.compile(r'^define\b.*?@([A-Za-z_.$][A-Za-z0-9_.$]*)\(')
          call_re = re.compile(r'\b(?:call|invoke)\b.*?@([A-Za-z_.$][A-Za-z0-9_.$]*)\(')
          current = None
          for ll in ir_dir.glob('*.ll'):
              for line in ll.read_text().splitlines():
                  m = define_re.match(line)
                  if m:
                      current = m.group(1)
                      calls.setdefault(current, set())
                      unresolved.setdefault(current, set())
                      continue
                  if current is not None and line.strip() == '}':
                      current = None
                      continue
                  if current is None:
                      continue
                  for target in call_re.findall(line):
                      if target.startswith('llvm.'):
                          continue
                      if target in frames:
                          calls[current].add(target)
                      else:
                          unresolved[current].add(target)

          memo = {}
          visiting = set()
          def deepest(name):
              if name in memo:
                  return memo[name]
              if name in visiting:
                  return (frames.get(name, 0), [name, '<cycle>'])
              visiting.add(name)
              best_child = (0, [])
              for child in sorted(calls.get(name, ())):
                  candidate = deepest(child)
                  if candidate[0] > best_child[0]:
                      best_child = candidate
              visiting.remove(name)
              result = (frames.get(name, 0) + best_child[0], [name] + best_child[1])
              memo[name] = result
              return result

          roots = [
              'main', 'aurora_runtime_init', 'aurora_runtime_poll', 'aurora_app_step_1ms',
              'aurora_app_on_protocol_frame', 'aurora_app_apply_settings',
              'SysTick_Handler', 'DMA_CH1_IRQHandler', 'ADC_IRQHandler',
              'ATMR_BRK_UP_TRG_COM_IRQHandler', 'COMP0_IRQHandler',
              'COMP1_2_3_IRQHandler', 'USART_IRQHandler'
          ]
          print('=== first-party O2 direct-call chain sums ===')
          for root in roots:
              if root not in frames:
                  print(f'{root}: not emitted / likely inlined or absent')
                  continue
              total, chain = deepest(root)
              print(f'{root}: {total} B :: ' + ' -> '.join(chain))
              ext = sorted(unresolved.get(root, ()))
              if ext:
                  print(f'  direct unresolved: {", ".join(ext)}')

          print('=== top first-party direct-call chains ===')
          ranked = sorted((deepest(name)[0], name, deepest(name)[1]) for name in frames)
          for total, name, chain in reversed(ranked[-30:]):
              print(f'{total:4d} B  {name}: ' + ' -> '.join(chain))
          PY
