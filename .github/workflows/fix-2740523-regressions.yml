name: Fix compile-remediation regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-2740523-regressions.yml'

permissions:
  contents: write

concurrency:
  group: fix-2740523-main
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited commit is in history
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2740523a441eec4d3b61dfbf933fafa5c9d8764d HEAD

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix_2740523.py

      - name: Run full software gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_checks.py

      - name: Clean transients and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build build-* Testing
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f MANIFEST.sha256
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name MANIFEST.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --check --strict MANIFEST.sha256
          git diff --check

      - name: Commit reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: harden compile-remediation state handling'
          git push origin HEAD:main
