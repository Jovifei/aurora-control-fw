name: o1 stack lock closeout

on:
  push:
    branches:
      - codex/o1-stack-lock-work

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ !contains(github.event.head_commit.message, '[o1-stack-lock-closeout]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/o1-stack-lock-work
          fetch-depth: 0

      - name: 应用Keil O1与双优化栈门禁
        run: python tools/_o1_stack_lock_closeout.py

      - name: 完整质量门验证
        shell: bash
        run: |
          git diff --check
          python tools/run_checks.py

      - name: 清理一次性工具并提交候选树
        shell: bash
        run: |
          rm -f tools/_o1_stack_lock_closeout.py
          rm -f .github/workflows/o1-stack-lock-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Jovifei@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "修复：锁定Keil O1并增加O1 O2双栈门禁 [o1-stack-lock-closeout]"
          git push origin HEAD:codex/o1-stack-lock-work
