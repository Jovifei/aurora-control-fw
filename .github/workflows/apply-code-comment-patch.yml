name: Apply code analysis and comments patch

on:
  push:
    branches:
      - codex/code-analysis-comments
    paths:
      - .github/workflows/apply-code-comment-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/code-comment-patch/part* > /tmp/code-comments.patch.xz.b64
          test "$(sha256sum /tmp/code-comments.patch.xz.b64 | cut -d' ' -f1)" = "fa43094a0df32dc901ffabe9740473befbb412045ce17441d95e817f1eb4656b"
          base64 -d /tmp/code-comments.patch.xz.b64 > /tmp/code-comments.patch.xz
          test "$(sha256sum /tmp/code-comments.patch.xz | cut -d' ' -f1)" = "735516738e0bb2ed4e1debffb501cfba8b53165270cda9b803ec9367c1036d85"
          xz -t /tmp/code-comments.patch.xz
          xz -d -c /tmp/code-comments.patch.xz > /tmp/code-comments.patch
          git apply --index /tmp/code-comments.patch
          rm -rf .github/code-comment-patch
          rm -f .github/workflows/apply-code-comment-patch.yml

      - name: Run firmware quality gates
        run: python tools/run_checks.py

      - name: Replace staging history with one clean commit
        shell: bash
        env:
          BASE_SHA: 3fe73fc322a65ebee95b06a80a02a72c56106efe
        run: |
          set -euo pipefail
          git config user.name "Jovifei"
          git config user.email "110970864+Jovifei@users.noreply.github.com"
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "docs: add function-level code analysis and standardize comments"
          git push --force-with-lease origin HEAD:codex/code-analysis-comments
