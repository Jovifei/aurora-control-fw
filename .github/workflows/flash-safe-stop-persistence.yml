name: flash safe stop persistence closeout

on:
  push:
    branches:
      - codex/flash-safe-stop-persistence

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ !contains(github.event.head_commit.message, '[flash-safe-closeout]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flash-safe-stop-persistence
          fetch-depth: 0

      - name: 应用 Flash 安全持久化修复
        run: python tools/_flash_safe_stop_patch.py

      - name: 完整质量门验证
        shell: bash
        run: |
          git diff --check
          python tools/run_checks.py

      - name: 清理一次性工具并提交
        shell: bash
        run: |
          rm -f tools/_flash_safe_stop_patch.py
          rm -f .github/workflows/flash-safe-stop-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "修复：规避欠压写Flash并加固双页Journal边界 [flash-safe-closeout]"
          git push origin HEAD:codex/flash-safe-stop-persistence
