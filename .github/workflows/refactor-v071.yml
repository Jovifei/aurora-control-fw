name: Apply v0.7.1 structure and comment remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refactor_v071.py'
      - '.github/workflows/refactor-v071.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refactor-v071-main
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply directory, comments and documentation remediation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/refactor_v071.py

      - name: Run architecture, style and Host gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_architecture.py
          python tools/check_code_style.py
          python tools/run_checks.py
          if [ -f tools/check_target_syntax.py ]; then
            python tools/check_target_syntax.py
          fi

      - name: Remove transient build outputs and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build build-* Testing
          rm -f MANIFEST.sha256
          find . -type f ! -path './.git/*' ! -name MANIFEST.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --check --strict MANIFEST.sha256

      - name: Commit remediation to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: standardize layout comments and release gates'
          git push origin HEAD:main
