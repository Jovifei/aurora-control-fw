name: v0.10.3 final closeout

on:
  push:
    branches:
      - codex/v0.10.3-safety-handshake-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ !contains(github.event.head_commit.message, '[v0103-final-closeout]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.10.3-safety-handshake-closeout
          fetch-depth: 0

      - name: 应用最终收尾修复
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # 1) Relay HOLD_OFF基准序号不能用合法的0值充当“未捕获”哨兵。
          replace_once(
              'app/inc/power_stage.h',
              '''    bool relay_closed;                               /* 软件期望继电器状态。 */\n    bool startup_success_recorded;                   /* 本轮成功后只减少一次启动延时。 */\n    bool startup_locked;                             /* 有限重试耗尽或严重过压后锁存。 */\n    bool demo_load_confirmed;                        /* Demo探测得到持续负载证据。 */\n    uint8_t state_reserved[3];                       /* 显式补齐结构尾部。 */''',
              '''    bool relay_closed;                               /* 软件期望继电器状态。 */\n    bool relay_holdoff_sequence_valid;               // true表示Runtime已在物理关PWM后捕获基准；sequence=0同样合法。\n    bool startup_success_recorded;                   /* 本轮成功后只减少一次启动延时。 */\n    bool startup_locked;                             /* 有限重试耗尽或严重过压后锁存。 */\n    bool demo_load_confirmed;                        /* Demo探测得到持续负载证据。 */\n    uint8_t state_reserved[2];                       /* 显式补齐结构尾部。 */''')

          replace_once(
              'app/src/power_stage.c',
              '''    ctx->demo_probe_since_ms = 0U;\n    ctx->demo_no_load_since_ms = 0U;\n\n    if ((state != AURORA_POWER_PRECHARGE) && (state != AURORA_POWER_RUN) &&''',
              '''    ctx->demo_probe_since_ms = 0U;\n    ctx->demo_no_load_since_ms = 0U;\n\n    if (state == AURORA_POWER_RELAY_HOLD_OFF)\n    {\n        // 0是32位ADC发布序号的合法回绕值；有效性必须由独立标志表示。\n        ctx->relay_holdoff_sequence = 0U;\n        ctx->relay_holdoff_sequence_valid = false;\n    }\n\n    if ((state != AURORA_POWER_PRECHARGE) && (state != AURORA_POWER_RUN) &&''')

          replace_once(
              'app/src/power_stage.c',
              '''                ctx->relay_closed = false;\n                ctx->relay_holdoff_sequence = 0U;\n                enter_state(ctx, AURORA_POWER_RELAY_HOLD_OFF, now_ms);''',
              '''                ctx->relay_closed = false;\n                enter_state(ctx, AURORA_POWER_RELAY_HOLD_OFF, now_ms);''')

          replace_once(
              'app/src/power_stage.c',
              '''        if ((ctx->relay_holdoff_sequence == 0U) ||\n            (elapsed_ms(now_ms, ctx->state_since_ms) < AURORA_RELAY_PWM_OFF_DECAY_MS) ||''',
              '''        if (!ctx->relay_holdoff_sequence_valid ||\n            (elapsed_ms(now_ms, ctx->state_since_ms) < AURORA_RELAY_PWM_OFF_DECAY_MS) ||''')

          replace_once(
              'app/src/power_stage.c',
              '''            /* 先进入共享关波放能状态；Demo闭合条件不复用Battery均压判据。 */\n            ctx->relay_holdoff_sequence = 0U;\n            enter_state(ctx, AURORA_POWER_RELAY_HOLD_OFF, now_ms);''',
              '''            /* 先进入共享关波放能状态；Demo闭合条件不复用Battery均压判据。 */\n            enter_state(ctx, AURORA_POWER_RELAY_HOLD_OFF, now_ms);''')

          replace_once(
              'app/src/main.c',
              '''            runtime->app.power_stage.relay_holdoff_sequence = runtime->app.sample.sequence;\n            runtime->app.power_stage.state_since_ms = drv_time_now_ms();\n            runtime->relay_holdoff_baseline_captured = true;''',
              '''            runtime->app.power_stage.relay_holdoff_sequence = runtime->app.sample.sequence;\n            runtime->app.power_stage.relay_holdoff_sequence_valid = true;\n            runtime->app.power_stage.state_since_ms = drv_time_now_ms();\n            runtime->relay_holdoff_baseline_captured = true;''')

          # 2) Host专用功率门覆盖宏禁止泄漏到目标固件。
          replace_once(
              'driver/src/drv_board.c',
              '''#include "board_config.h"\n\n/*---------------------------------------------------------------------------*''',
              '''#include "board_config.h"\n\n#if defined(AURORA_HOST_TEST_POWER_GATES_OPEN) && !defined(AURORA_HOST_TEST)\n#error "AURORA_HOST_TEST_POWER_GATES_OPEN is forbidden in target firmware"\n#endif\n\n/*---------------------------------------------------------------------------*''')

          text = read('driver/src/drv_board.c')
          count = text.count('#if defined(AURORA_HOST_TEST_POWER_GATES_OPEN)')
          if count != 2:
              raise SystemExit(f'driver/src/drv_board.c: expected 2 Host gate branches, got {count}')
          text = text.replace(
              '#if defined(AURORA_HOST_TEST_POWER_GATES_OPEN)',
              '#if defined(AURORA_HOST_TEST) && defined(AURORA_HOST_TEST_POWER_GATES_OPEN)')
          write('driver/src/drv_board.c', text)

          # 3) 明确最终验收Gate不是Bring-up阶段的临时使能开关。
          replace_once(
              'driver/inc/board_config.h',
              '''/* PinMap已经人工复核。 */\n#define BOARD_GATE_PINMAP_REVIEWED                  (1U)''',
              '''/*\n * 以下BOARD_GATE_*与BOARD_POWER_OUTPUT_ALLOWED是最终验收证据门，不是Bring-up阶段使能开关。\n * 低压/分阶段台架必须使用独立受限Bring-up构建，只开放当阶段最小能力；\n * 禁止为了“能跑台架”提前把尚未完成的最终验收Gate置1。\n */\n/* PinMap已经人工复核。 */\n#define BOARD_GATE_PINMAP_REVIEWED                  (1U)''')

          # 4) C行为测试：锁定sequence=0合法、两块新DMA与Host门宏编译契约。
          replace_once(
              'tests/test_v0103.c',
              '''    runtime.app.sample = valid_sample(9U, 0U);\n    runtime.app.power_stage.state = AURORA_POWER_RELAY_HOLD_OFF;\n    runtime.app.power_stage.relay_holdoff_sequence = 0U;''',
              '''    // 模拟32位ADC发布序号恰好回绕到0；0不能再被当成“未捕获”哨兵。\n    runtime.app.sample = valid_sample(0U, 0U);\n    runtime.app.power_stage.state = AURORA_POWER_RELAY_HOLD_OFF;\n    runtime.app.power_stage.relay_holdoff_sequence = 123U;\n    runtime.app.power_stage.relay_holdoff_sequence_valid = false;''')

          replace_once(
              'tests/test_v0103.c',
              '''    CHECK(runtime.relay_holdoff_baseline_captured);\n    CHECK(runtime.app.power_stage.relay_holdoff_sequence == 9U);\n    CHECK(!mock_pwm_active());''',
              '''    CHECK(runtime.relay_holdoff_baseline_captured);\n    CHECK(runtime.app.power_stage.relay_holdoff_sequence_valid);\n    CHECK(runtime.app.power_stage.relay_holdoff_sequence == 0U);\n    CHECK(!mock_pwm_active());''')

          replace_once(
              'tests/test_v0103.c',
              '''    ctx.state_since_ms = 1000U;\n    ctx.relay_holdoff_sequence = 1U;\n\n    sample.sequence = 2U;''',
              '''    ctx.state_since_ms = 1000U;\n    ctx.relay_holdoff_sequence = 1U;\n    ctx.relay_holdoff_sequence_valid = true;\n\n    sample.sequence = 2U;''')

          replace_once(
              'tests/test_v0103.c',
              '''    ctx.state_since_ms = 0U;\n    ctx.relay_holdoff_sequence = 10U;\n    sample.bus_voltage_mv = sample.battery_voltage_mv - AURORA_RELAY_CLOSE_DELTA_MV - 1000L;''',
              '''    ctx.state_since_ms = 0U;\n    ctx.relay_holdoff_sequence = 10U;\n    ctx.relay_holdoff_sequence_valid = true;\n    sample.bus_voltage_mv = sample.battery_voltage_mv - AURORA_RELAY_CLOSE_DELTA_MV - 1000L;''')

          marker = '''/*---------------------------------------------------------------------------*\n * Name        : static void test_holdoff_delta_loss_is_bounded(void)'''
          if read('tests/test_v0103.c').count(marker) != 1:
              raise SystemExit('tests/test_v0103.c: holdoff test insertion marker mismatch')
          wrap_test = r'''/*---------------------------------------------------------------------------*
 * Name        : static void test_holdoff_sequence_wrap_zero_is_valid(void)
 * Input       : 无
 * Output      : 无
 * Description : 验证关波基准恰好为sequence=0时仍按无符号回绕等待两个新DMA块，不会永久卡死。
 *---------------------------------------------------------------------------*/
static void test_holdoff_sequence_wrap_zero_is_valid(void)
{
    aurora_power_stage_ctx_t ctx;
    aurora_measurement_t sample = valid_sample(1U, 1021U);
    aurora_mppt_output_t mppt = {0};
    aurora_charge_output_t charger = {0};
    aurora_power_command_t command;

    charger.voltage_target_mv = 50000U;
    aurora_power_stage_init(&ctx, 0U);
    ctx.state = AURORA_POWER_RELAY_HOLD_OFF;
    ctx.state_since_ms = 1000U;
    ctx.relay_holdoff_sequence = 0U;
    ctx.relay_holdoff_sequence_valid = true;

    command = aurora_power_stage_step_ex(&ctx, &sample, &mppt, &charger, true, true, false,
                                         false, 0U, AURORA_MODE_BATTERY, 48000U, 30000U, 1021U);
    CHECK(command.state == AURORA_POWER_RELAY_HOLD_OFF);
    CHECK(!command.relay_enable);

    sample.sequence = 2U;
    sample.timestamp_ms = 1022U;
    command = aurora_power_stage_step_ex(&ctx, &sample, &mppt, &charger, true, true, false,
                                         false, 0U, AURORA_MODE_BATTERY, 48000U, 30000U, 1022U);
    CHECK(command.state == AURORA_POWER_RELAY_SETTLE);
    CHECK(command.relay_enable);
}

'''
          text = read('tests/test_v0103.c')
          write('tests/test_v0103.c', text.replace(marker, wrap_test + marker, 1))

          replace_once(
              'tests/test_v0103.c',
              '''    test_holdoff_requires_two_new_blocks_and_matching_generation();\n    test_holdoff_delta_loss_is_bounded();''',
              '''    test_holdoff_requires_two_new_blocks_and_matching_generation();\n    test_holdoff_sequence_wrap_zero_is_valid();\n    test_holdoff_delta_loss_is_bounded();''')

          replace_once(
              'tests/test_v0103_contract.py',
              '''        self.assertIn("relay_holdoff_sequence", power)\n        self.assertIn("AURORA_RELAY_POST_OFF_MIN_BLOCKS", power)''',
              '''        self.assertIn("relay_holdoff_sequence", power)\n        self.assertIn("relay_holdoff_sequence_valid", power)\n        self.assertIn("!ctx->relay_holdoff_sequence_valid", power)\n        self.assertIn("AURORA_RELAY_POST_OFF_MIN_BLOCKS", power)''')

          replace_once(
              'tests/test_v0103_contract.py',
              '''        protocol = (ROOT / "app/src/protocol.c").read_text(encoding="utf-8")\n        self.assertIn("drv_board_power_gate_open()", main_c)''',
              '''        protocol = (ROOT / "app/src/protocol.c").read_text(encoding="utf-8")\n        board_driver = (ROOT / "driver/src/drv_board.c").read_text(encoding="utf-8")\n        self.assertIn("drv_board_power_gate_open()", main_c)''')

          replace_once(
              'tests/test_v0103_contract.py',
              '''        self.assertIn("settings->charge_est_lifetime_energy_wh", protocol)''',
              '''        self.assertIn("settings->charge_est_lifetime_energy_wh", protocol)\n        self.assertIn(\n            "#if defined(AURORA_HOST_TEST_POWER_GATES_OPEN) && !defined(AURORA_HOST_TEST)",\n            board_driver,\n        )\n        self.assertIn(\n            "#if defined(AURORA_HOST_TEST) && defined(AURORA_HOST_TEST_POWER_GATES_OPEN)",\n            board_driver,\n        )''')

          # 5) README：CI改为fail-closed、能量语义说清、台架门策略消除循环歧义。
          replace_once(
              'README.md',
              '''- [v0.10.3安全握手与快故障修复](docs/45-v0.10.3-安全握手与快故障修复说明.md)''',
              '''- [v0.10.3安全握手与快故障修复](docs/45-v0.10.3-安全握手与快故障修复说明.md)\n- [新工程分阶段移植与板级验证路线](docs/46-v0.10.3-新工程分阶段移植与板级验证路线.md)\n- [v0.10.3审阅问题补强与验证记录](docs/47-v0.10.3-审阅问题补强与验证记录.md)''')

          replace_once(
              'README.md',
              '''本地若缺少某个编译器，脚本会在输出中明确显示 `skip`；正式发布结论应以工具齐全的 GitHub Actions、Keil ARM Compiler 6日志和MAP审计共同为准。Host通过不等于功率板验收通过。''',
              '''`run_checks.py`采用fail-closed：缺少CMake、Ninja、GCC或Clang任一必需工具时直接失败，不输出完整PASS结论。正式发布结论仍必须结合工具齐全的GitHub Actions、Keil ARM Compiler 6日志和MAP审计；Host通过不等于功率板验收通过。''')

          replace_once(
              'README.md',
              '''SOFTWARE SAFETY FIXED\nREADY FOR LOW-VOLTAGE BENCH\nPOWER GATES STILL LOCKED\nOTA/IAP OUT OF SCOPE''',
              '''SOFTWARE SAFETY FIXED\nSOFTWARE CANDIDATE FOR BRING-UP INTEGRATION\nPRODUCTION BUILD POWER GATES STILL LOCKED\nOTA/IAP OUT OF SCOPE''')

          replace_once(
              'README.md',
              '''本版本不修改3A CC、12A PV限流、BST_U分压BOM或既有30字节遥测字段语义；也不新增OTA/IAP代码。''',
              '''本版本不修改3A CC、12A PV限流和BST_U分压BOM，也不新增OTA/IAP代码。旧30字节遥测**布局不变**；daily/lifetime能量字段恢复120W兼容的电池侧充电量语义，当前硬件无BAT_I，因此该值明确为ESTIMATED。\n\n当前`BOARD_GATE_*`与`BOARD_POWER_OUTPUT_ALLOWED`是最终验收证据门，不作为低压Bring-up的临时使能开关。当前生产配置本身不会直接解锁Relay/PWM；低压验证应按`docs/46-v0.10.3-新工程分阶段移植与板级验证路线.md`使用独立受限Bring-up构建，只开放当前阶段所需的最小能力，不能提前把尚未验收的最终Gate置1。''')

          # 6) 文档入口：明确Bring-up构建边界，并把重复46改为47。
          replace_once(
              'docs/README.md',
              '''16. [46-新工程分阶段移植与板级验证路线](46-v0.10.3-新工程分阶段移植与板级验证路线.md)\n17. [程序代码分析阅读索引](程序代码分析/00-阅读索引.md)''',
              '''16. [46-新工程分阶段移植与板级验证路线](46-v0.10.3-新工程分阶段移植与板级验证路线.md)\n17. [47-v0.10.3审阅问题补强与验证记录](47-v0.10.3-审阅问题补强与验证记录.md)\n18. [程序代码分析阅读索引](程序代码分析/00-阅读索引.md)''')

          replace_once(
              'docs/README.md',
              '''当前版本只具备进入低压限流台架的**软件候选资格**。Keil v0.10.3重新构建、模拟标定、COMP→Break→Vgs、Relay拉弧、Demo真实负载和300W SOA仍需单独留证据。''',
              '''当前版本只具备集成到受限Bring-up构建的**软件候选资格**。当前生产配置的最终验收Gate全部保持fail-closed，不能直接作为“解门台架固件”；低压验证应按46号路线使用独立Bring-up构建，只开放当阶段最小能力。Keil v0.10.3重新构建、模拟标定、COMP→Break→Vgs、Relay拉弧、Demo真实负载和300W SOA仍需单独留证据。''')

          old_doc = ROOT / 'docs/46-v0.10.3-审阅问题补强与验证记录.md'
          new_doc = ROOT / 'docs/47-v0.10.3-审阅问题补强与验证记录.md'
          if not old_doc.exists() or new_doc.exists():
              raise SystemExit('审阅记录重编号前置条件不满足')
          text = old_doc.read_text(encoding='utf-8')
          text = text.replace('# 46 · v0.10.3 审阅问题补强与验证记录',
                              '# 47 · v0.10.3 审阅问题补强与验证记录', 1)
          text += '''\n\n## 最终收尾补强\n\n- `relay_holdoff_sequence` 不再使用 `0` 作为“未捕获”哨兵；新增独立 `relay_holdoff_sequence_valid`。即使32位ADC发布序号在长期运行后回绕到0，HOLD_OFF仍可按无符号差值等待两个新DMA发布块，不会永久卡死。\n- `AURORA_HOST_TEST_POWER_GATES_OPEN` 增加编译期保险：只有同时定义 `AURORA_HOST_TEST` 的Host目标才能启用；目标固件误配该宏会直接 `#error`。\n- 当前仓库的 `BOARD_GATE_*` 与 `BOARD_POWER_OUTPUT_ALLOWED` 明确定义为**最终验收证据门**，不是Bring-up阶段的临时开关。低压/分阶段板测使用46号路线中的独立受限Bring-up构建，不通过提前置1最终Gate来绕过验收。\n\n因此当前发布措辞统一为：`SOFTWARE CANDIDATE FOR BRING-UP INTEGRATION / PRODUCTION BUILD POWER GATES STILL LOCKED`。\n'''
          new_doc.write_text(text, encoding='utf-8', newline='\n')
          old_doc.unlink()

          replace_once(
              'docs/00-文档索引.md',
              '''| 46 | [v0.10.3-新工程分阶段移植与板级验证路线](46-v0.10.3-新工程分阶段移植与板级验证路线.md) | 从空工程按G0~G15逐级移植，包含抑制项、测试步骤、仪器、PASS门槛、故障注入和额定功率放行规则 |\n| 程序代码分析 | [阅读索引](程序代码分析/00-阅读索引.md) | 按模块学习300W源码、调用关系和调试切入点 |\n\n`docs/reference/`保存120W Checklist和派生迁移表等证据文件；不保存旧HT32源码、闭源MPPT库或原始录音。\n- `docs/46-v0.10.3-审阅问题补强与验证记录.md`：二次审核发现的Relay/ADC/能量与预充问题闭环。''',
              '''| 46 | [v0.10.3-新工程分阶段移植与板级验证路线](46-v0.10.3-新工程分阶段移植与板级验证路线.md) | 从空工程按G0~G15逐级移植，包含抑制项、测试步骤、仪器、PASS门槛、故障注入和额定功率放行规则 |\n| 47 | [v0.10.3-审阅问题补强与验证记录](47-v0.10.3-审阅问题补强与验证记录.md) | 二次审核发现的Relay/ADC/能量、序号回绕、Host门禁与Bring-up边界闭环 |\n| 程序代码分析 | [阅读索引](程序代码分析/00-阅读索引.md) | 按模块学习300W源码、调用关系和调试切入点 |\n\n`docs/reference/`保存120W Checklist和派生迁移表等证据文件；不保存旧HT32源码、闭源MPPT库或原始录音。''')

          print('v0.10.3最终收尾修改已应用')
          PY

      - name: 验证完整质量门
        shell: bash
        run: |
          git diff --check
          python tools/run_checks.py

      - name: 提交已验证修改
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "修复：关闭 v0.10.3 序号回绕与测试门禁配置隐患 [v0103-final-closeout]"
          git push origin HEAD:codex/v0.10.3-safety-handshake-closeout
