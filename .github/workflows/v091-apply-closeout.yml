name: Apply v0.9.1 closeout

on:
  push:
    branches:
      - codex/v0.9.1-ntc-parity-closeout
    paths:
      - tools/.v091_patch_08

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reassemble reviewed patch
        run: |
          cat tools/.v091_patch_0* | base64 -d > tools/.apply_v091_closeout.py
          python -m py_compile tools/.apply_v091_closeout.py

      - name: Apply v0.9.1 closeout
        run: |
          python tools/.apply_v091_closeout.py
          rm -f tools/.apply_v091_closeout.py
          rm -rf tools/__pycache__

      - name: Show generated closeout layout
        run: |
          echo '--- app/src/main.c 470-670 ---'
          nl -ba app/src/main.c | sed -n '470,670p'
          echo '--- app/src/storage.c 105-155 ---'
          nl -ba app/src/storage.c | sed -n '105,155p'
          echo '--- app/inc/storage.h 35-65 ---'
          nl -ba app/inc/storage.h | sed -n '35,65p'

      - name: Run all firmware checks
        run: python tools/run_checks.py

      - name: Commit generated closeout
        run: |
          git config user.name "Jovifei"
          git config user.email "110970864+Jovifei@users.noreply.github.com"
          git add -A
          git commit -m "feat: v0.9.1 close NTC and remaining parity gaps"
          git push origin HEAD:${GITHUB_REF_NAME}
