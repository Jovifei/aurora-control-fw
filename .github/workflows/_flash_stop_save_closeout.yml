name: flash stop-save closeout temporary

on:
  push:
    branches:
      - codex/flash-stop-save-guard

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/flash-stop-save-guard
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch, verify, clean and commit
        run: python tools/_flash_stop_save_closeout.py
