<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
<style>
    .title { font: 700 22px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
    .smallbox { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; rx: 10; ry: 10; }
    .txt { font: 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
    .stxt { font: 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #334155; }
    .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 7 5; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
  </marker>
</defs>

<text x="40" y="40" class="title">main.c / runtime 主流程图</text>
<rect x="410" y="70" width="280" height="70" class="box"/><text x="495" y="112" class="txt">main()</text>
<rect x="380" y="180" width="340" height="84" class="smallbox"/><text x="425" y="214" class="txt">drv_system_init / drv_io_init</text><text x="404" y="240" class="stxt">GPIO 安全态、等待 VDD 稳定、再做 runtime_init</text>
<rect x="380" y="304" width="340" height="78" class="smallbox"/><text x="426" y="340" class="txt">aurora_runtime_poll()</text><text x="432" y="364" class="stxt">主循环消费事件并调度各模块</text>

<rect x="90" y="456" width="190" height="82" class="smallbox"/><text x="125" y="495" class="txt">RUNTIME_EVENT_ADC</text><text x="127" y="519" class="stxt">process_adc</text>
<rect x="310" y="456" width="190" height="82" class="smallbox"/><text x="344" y="495" class="txt">RUNTIME_EVENT_UART_RX</text><text x="361" y="519" class="stxt">process_uart</text>
<rect x="530" y="456" width="190" height="82" class="smallbox"/><text x="580" y="495" class="txt">RUNTIME_EVENT_TICK</text><text x="563" y="519" class="stxt">app_step_1ms</text>
<rect x="750" y="456" width="250" height="82" class="smallbox"/><text x="790" y="495" class="txt">RUNTIME_EVENT_FAST_FAULT</text><text x="780" y="519" class="stxt">锁存故障 + force_safe_off</text>

<rect x="390" y="580" width="320" height="50" class="smallbox"/><text x="425" y="611" class="stxt">之后继续：apply_power_command → telemetry → storage → watchdog</text>

<path d="M550,140 L550,180" class="line"/>
<path d="M550,264 L550,304" class="line"/>
<path d="M550,382 L185,456" class="line"/>
<path d="M550,382 L405,456" class="line"/>
<path d="M550,382 L625,456" class="line"/>
<path d="M550,382 L875,456" class="line"/>
<path d="M625,538 L550,580" class="line"/>

</svg>