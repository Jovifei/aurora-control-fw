<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<style>
    .title { font: 700 22px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
    .smallbox { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; rx: 10; ry: 10; }
    .txt { font: 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
    .stxt { font: 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #334155; }
    .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 7 5; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
  </marker>
</defs>

<text x="40" y="40" class="title">protocol / storage / ui / driver 关系图</text>
<rect x="70" y="110" width="250" height="86" class="box"/><text x="150" y="151" class="txt">protocol.c</text><text x="118" y="176" class="stxt">字节流解析、帧组包、主动遥测</text>
<rect x="390" y="110" width="250" height="86" class="box"/><text x="477" y="151" class="txt">storage.c</text><text x="419" y="176" class="stxt">设置/能量统计双页 Journal 编解码</text>
<rect x="710" y="110" width="250" height="86" class="box"/><text x="810" y="151" class="txt">ui.c</text><text x="753" y="176" class="stxt">RUN / FAULT 双灯闪烁逻辑</text>

<rect x="170" y="330" width="170" height="78" class="smallbox"/><text x="220" y="370" class="txt">drv_uart</text>
<rect x="410" y="330" width="170" height="78" class="smallbox"/><text x="455" y="370" class="txt">drv_flash</text>
<rect x="650" y="330" width="170" height="78" class="smallbox"/><text x="702" y="370" class="txt">drv_io</text>
<rect x="890" y="330" width="170" height="78" class="smallbox"/><text x="937" y="370" class="txt">drv_board</text>

<path d="M195,196 L255,330" class="line"/>
<path d="M515,196 L495,330" class="line"/>
<path d="M835,196 L735,330" class="line"/>
<path d="M515,196 L975,330" class="line dashed"/>
<text x="110" y="500" class="stxt">protocol 关心“线上格式”；storage 关心“掉电后能否恢复”；ui 关心“如何让人看懂状态”；</text>
<text x="110" y="528" class="stxt">driver 则关心“寄存器和引脚怎么操作”。这几个模块都不是控制算法核心，但读懂后调试效率会明显提高。</text>

</svg>